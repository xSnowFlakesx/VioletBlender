name: Windows build and startup

on:
  workflow_dispatch:
  push:
    branches:
      - mmd-main
      - codex/windows-build-bootstrap

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out source without LFS smudging
        uses: actions/checkout@v4
        # The build script retrieves upstream Blender LFS files and pinned Windows libraries.
        with:
          lfs: false
          submodules: false

      - name: Build and test installed Blender
        shell: pwsh
        run: |
          ./build_files/windows/build_violet.ps1 `
            -BuildDirectory "$env:RUNNER_TEMP/violet-build" `
            -InstallDirectory "$env:RUNNER_TEMP/violet-install" `
            -Jobs 2

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VioletBlender-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/violet-install/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/violet-build/windows-build.log
            ${{ runner.temp }}/violet-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/violet-build/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7
